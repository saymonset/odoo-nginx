# Upstream principal Odoo
upstream odoo {
    server 127.0.0.1:18069;
}

# Upstream longpolling/evented
upstream odoo_longpolling {
    server 127.0.0.1:8072;
}

# Nuevos upstreams para el subdominio leads - CORREGIDO
upstream odoo_leads {
    server 127.0.0.1:28069;
}

upstream odoo_leads_longpolling {
    server 127.0.0.1:28072;
}

upstream pgadmin {
    server 127.0.0.1:8080;
}

# Upstream chatwoot
upstream chatwoot {
    server 127.0.0.1:3000;
}

upstream n8n {
    server 127.0.0.1:5678;
    keepalive 32;
}

# SUBDOMINIO chatwoot - REDIRECCIÓN HTTP → HTTPS
server {
    listen 80;
    server_name chatwoot.jumpjibe.com;
    return 301 https://chatwoot.jumpjibe.com$request_uri;
}

# SUBDOMINIO chatwoot - HTTPS (CORREGIDO CON underscores_in_headers)
server {
    listen 443 ssl http2;
    server_name chatwoot.jumpjibe.com;

    ssl_certificate /etc/letsencrypt/live/chatwoot.jumpjibe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatwoot.jumpjibe.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/chatwoot.jumpjibe.com/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    # <<< CLAVE PARA SOLUCIONAR EL ERROR DE api_access_token >>>
    underscores_in_headers on;

    client_max_body_size 50M;
    
    # Cabeceras proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Ssl on;
    
    # WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Active Storage
    location /rails/active_storage/ {
        proxy_pass http://chatwoot;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Ssl on;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket /cable
    location /cable {
        proxy_pass http://chatwoot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
    }

    # Configuración principal
    location / {
        proxy_pass http://chatwoot;
        proxy_redirect off;
    }
}

# pgAdmin
server {
    listen 80;
    server_name pgadmin.jumpjibe.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pgadmin.jumpjibe.com;

    ssl_certificate     /etc/letsencrypt/live/pgadmin.jumpjibe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pgadmin.jumpjibe.com/privkey.pem;
    include             snippets/ssl.conf;
    include             snippets/letsencrypt.conf;

    # También añadimos aquí por consistencia
    underscores_in_headers on;

    location / {
        proxy_pass http://pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
