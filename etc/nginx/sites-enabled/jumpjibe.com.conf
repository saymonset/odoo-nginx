# Upstream principal Odoo
upstream odoo {
    server 127.0.0.1:18069;
}

# Upstream longpolling/evented
upstream odoo_longpolling {
    server 127.0.0.1:8072;
}

# Nuevos upstreams para el subdominio leads - CORREGIDO
upstream odoo_leads {
    server 127.0.0.1:28069;
}

upstream odoo_leads_longpolling {
    server 127.0.0.1:28072;
}

upstream pgadmin {
    server 127.0.0.1:8080;
}

# Upstream chatwoot
upstream chatwoot {
    server 127.0.0.1:3000;
}

upstream n8n {
    server 127.0.0.1:5678;
    keepalive 32;
}

upstream postiz {
    server 127.0.0.1:4007;          # Postiz corre en el puerto 4007 del host
}

upstream temporal {
    server 127.0.0.1:8180;          # Temporal UI corre en el puerto 8080
}

# SUBDOMINIO postiz - REDIRECCIÓN HTTP → HTTPS
server {
    listen 80;
    server_name postiz.integraia.lat;
    return 301 https://postiz.integraia.lat$request_uri;
}

# SUBDOMINIO postiz - HTTPS (CORREGIDO CON underscores_in_headers)
server {
    listen 443 ssl http2;
    server_name postiz.integraia.lat;

    ssl_certificate /etc/letsencrypt/live/postiz.integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postiz.integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/postiz.integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    # <<< CLAVE PARA SOLUCIONAR EL ERROR DE api_access_token >>>
    underscores_in_headers on;

    client_max_body_size 50M;
    
    # Cabeceras proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Ssl on;
    
    # WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Active Storage
    location /rails/active_storage/ {
        proxy_pass http://postiz;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Ssl on;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket /cable
    location /cable {
        proxy_pass http://postiz;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
    }

    # Configuración principal
    location / {
        proxy_pass http://postiz;
        proxy_redirect off;
    }
}
