# DOMINIO PRINCIPAL integraia.lat
server {
    listen 80;
    server_name integraia.lat www.integraia.lat;
    include snippets/letsencrypt.conf;
    return 301 https://integraia.lat$request_uri;
}

server {
    listen 443 ssl http2;
    server_name integraia.lat www.integraia.lat;

    ssl_certificate /etc/letsencrypt/live/integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    access_log /var/log/nginx/odoo.access.log;
    error_log /var/log/nginx/odoo.error.log;

    # Cabeceras proxy mejoradas
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    location ~ \.css$ {
        proxy_pass http://odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/css" always;
    }

    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        add_header Cache-Control "public, immutable";

        location ~ \.css$ {
            add_header Content-Type "text/css" always;
        }
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    location /longpolling/ {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# SUBDOMINIO lead.integraia.lat
server {
    listen 80;
    server_name lead.integraia.lat;
    return 301 https://lead.integraia.lat$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lead.integraia.lat;

    ssl_certificate /etc/letsencrypt/live/lead.integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lead.integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lead.integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    access_log /var/log/nginx/odoo_leads.access.log;
    error_log /var/log/nginx/odoo_leads.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_buffering off;

    location ~ \.css$ {
        proxy_pass http://odoo_leads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/css" always;
    }

    location ~* /web/static/ {
        proxy_pass http://odoo_leads;
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        add_header Cache-Control "public, immutable";

        location ~ \.css$ {
            add_header Content-Type "text/css" always;
        }
    }

    location / {
        proxy_pass http://odoo_leads;
        proxy_redirect http://odoo_leads/ https://lead.integraia.lat/;
        proxy_redirect https://odoo_leads/ https://lead.integraia.lat/;
        proxy_redirect /web/ /web/;
    }

    location /longpolling/ {
        proxy_pass http://odoo_leads_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# n8n
server {
    listen 80;
    server_name n8n.integraia.lat;
    include snippets/letsencrypt.conf;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name n8n.integraia.lat;

    ssl_certificate /etc/letsencrypt/live/n8n.integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/n8n.integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    # Añadido también aquí por si n8n usa headers con underscores en el futuro
    underscores_in_headers on;

    access_log /var/log/nginx/n8n.access.log;
    error_log /var/log/nginx/n8n.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    location / {
        proxy_pass http://n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://n8n;
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 10d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
    gzip_vary on;
    gzip_min_length 1024;
}
